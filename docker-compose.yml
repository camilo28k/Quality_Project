# Levanta TiendApp con Docker. La base de datos sigue en Supabase (backend/.env).
# Uso: docker compose up --build   ->  http://localhost:3000
# Correo en desarrollo: Mailpit (bandeja en http://localhost:8025). En backend/.env:
#   SMTP_HOST="mailpit"  SMTP_PORT=1025  MAIL_FROM_ADDRESS="facturas@tiendapp.test"
# En producción se reemplaza por el SMTP real (credenciales solo en .env).
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: "4000"
      FRONTEND_URL: "http://localhost:3000"
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # Dentro de la red de Docker el backend se llama "backend", no localhost.
      BACKEND_URL: "http://backend:4000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Servidor de correo local para desarrollo y pruebas (no envía a Internet).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
